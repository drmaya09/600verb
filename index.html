<style>
  :root{
    --bg:#1A1826; --bg-2:#221F33; --surface:#2A2740; --surface-2:#332F4C;
    --paper:#F4EFE3; --paper-line:#E4DCC8;
    --ink:#ECE7DB; --ink-dim:#9E99B4; --ink-faint:#6E6A85;
    --card-ink:#231F2C; --card-ink-dim:#6a6472;
    --accent:#F2B33D; --accent-soft:rgba(242,179,61,.16);
    --success:#54C79A; --success-soft:rgba(84,199,154,.16);
    --danger:#EC6A66; --danger-soft:rgba(236,106,102,.16);
    --blue:#8fb0ff; --blue-soft:rgba(120,160,255,.16);
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
    --font-serif:'Fraunces','Georgia','Times New Roman',serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);color:var(--ink);
    background:
      radial-gradient(1100px 600px at 50% -8%, #2b2740 0%, rgba(43,39,64,0) 60%),
      radial-gradient(700px 500px at 50% 6%, var(--accent-soft) 0%, rgba(242,179,61,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-family:var(--font-serif);font-weight:600;font-size:1.32rem;letter-spacing:-.01em;white-space:nowrap}
  .brand .tag{font-size:.72rem;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}

  .overview{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .ov-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
  .ov-num{font-family:var(--font-serif);font-size:2.1rem;font-weight:600;line-height:1}
  .ov-num small{font-size:1rem;color:var(--ink-dim);font-family:var(--font-sans);font-weight:500}
  .ov-label{font-size:.86rem;color:var(--ink-dim);text-align:right}
  .ov-label b{color:var(--accent);font-weight:600}
  .ov-foot{margin-top:11px;font-size:.8rem;color:var(--ink-faint)}
  .bar{height:9px;border-radius:99px;background:var(--surface);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E7A62F,var(--accent));transition:width .5s cubic-bezier(.2,.7,.2,1)}

  .review-btn{display:flex;width:100%;align-items:center;gap:14px;text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-bottom:26px;transition:.16s}
  .review-btn:hover{border-color:var(--line-2);background:var(--surface)}
  .review-btn .rb-ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.15rem}
  .review-btn .rb-t{font-weight:600;font-size:.98rem}
  .review-btn .rb-s{font-size:.82rem;color:var(--ink-dim);margin-top:1px}
  .review-btn .rb-count{margin-left:auto;font-family:var(--font-serif);font-weight:600;font-size:1.35rem;color:var(--accent)}
  .review-btn[disabled]{opacity:.5;cursor:default}
  .review-btn[disabled]:hover{border-color:var(--line);background:var(--bg-2)}

  .daily{display:flex;gap:16px;align-items:stretch;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .streak{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-right:16px;border-right:1px solid var(--line);min-width:94px}
  .ember{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:600;font-size:1.55rem;color:var(--card-ink);background:radial-gradient(circle at 50% 38%, #FFE0A3, var(--accent));box-shadow:0 0 0 1px rgba(242,179,61,.5), 0 0 20px 2px rgba(242,179,61,.4)}
  .ember.dim{background:var(--surface-2);color:var(--ink-faint);box-shadow:none}
  .s-lbl{font-size:.74rem;color:var(--ink-dim);text-align:center;line-height:1.35}
  .s-best{color:var(--ink-faint);font-size:.68rem}
  .daily.solo{align-items:center;gap:14px}
  .daily.solo .s-best{font-size:.76rem;margin-top:2px}
  .strk-main{font-size:.95rem;color:var(--ink);font-weight:600}
  .bk-sec{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .bk-h{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
  .bk-desc{font-size:.86rem;color:var(--ink-dim);line-height:1.5;margin-bottom:12px}
  .bk-code{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;line-height:1.4;resize:vertical;word-break:break-all}
  .bk-code:focus{outline:none;border-color:var(--accent)}
  .bk-btn{width:100%;margin-top:10px;padding:12px;border-radius:11px;background:var(--accent);color:#2a1e05;font-weight:600;font-size:.95rem;transition:.14s}
  .bk-btn:hover{background:#f5bf5a}
  .bk-btn.load{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
  .bk-btn.load:hover{background:var(--surface-2)}
  .bk-note{margin-top:9px;font-size:.74rem;color:var(--ink-faint);text-align:right;line-height:1.4}
  .bk-msg{margin-top:10px;font-size:.85rem;color:var(--danger);line-height:1.4}
  .bk-cf{display:flex;gap:10px}
  .bk-yes{flex:1;padding:12px;border-radius:11px;background:var(--danger);color:#3a1211;font-weight:600;transition:.14s}
  .bk-yes[disabled]{opacity:.6}
  .bk-no{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line-2);color:var(--ink-dim);font-weight:600}
  .goal{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
  .g-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .g-lbl{font-size:.84rem;color:var(--ink-dim);font-weight:600}
  .g-edit{font-size:.72rem;color:var(--ink-faint);text-decoration:underline;text-underline-offset:2px}
  .g-edit:hover{color:var(--ink-dim)}
  .g-bar{height:9px;border-radius:99px;background:var(--surface);overflow:hidden}
  .g-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#FFE0A3);transition:width .4s ease}
  .goal.met .g-bar i{background:linear-gradient(90deg,var(--success),#8fe0c0)}
  .g-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .g-val{font-family:var(--font-serif);font-weight:600;font-size:1.05rem;color:var(--accent);font-variant-numeric:tabular-nums}
  .goal.met .g-val{color:var(--success)}
  .g-note{font-size:.76rem;color:var(--ink-faint)}
  .goal.met .g-note{color:var(--success)}
  .g-presets{display:flex;gap:6px;margin-top:2px}
  .g-presets button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);font-size:.8rem;font-weight:600;transition:.14s}
  .g-presets button:hover{border-color:var(--line-2);color:var(--ink)}
  .g-presets button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .hidden-link{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 22px;padding:13px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);font-weight:600;font-size:.9rem;transition:.15s}
  .hidden-link:hover{color:var(--ink);border-color:var(--line-2);background:var(--surface)}
  .hidden-link .hl-n{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
  .hide-word{display:block;margin:14px auto 0;padding:9px 14px;border-radius:10px;border:1px solid transparent;color:var(--ink-faint);font-size:.82rem;transition:.15s}
  .hide-word:hover{color:var(--danger);border-color:var(--line)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:50;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:.9rem;opacity:0;pointer-events:none;transition:.22s}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{color:var(--accent);font-weight:600;font-size:.86rem;white-space:nowrap}
  .hm-all{width:100%;margin-bottom:14px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);font-weight:600;font-size:.88rem;transition:.15s}
  .hm-all:hover{color:var(--ink);border-color:var(--line-2);background:var(--surface)}

  .cl-tr.show{opacity:1}
  .opt-means{max-width:34ch;margin:14px auto 0;display:flex;flex-direction:column;gap:6px}
  .om-row{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
  .om-row.ok{border-color:var(--success);background:var(--success-soft)}

  .om-row.ok .om-tr{color:var(--success)}
  .dv-head{margin-bottom:2px}
  .dv-reveal{max-width:32ch;margin:20px auto 0;text-align:center;color:var(--ink-dim);font-size:1rem;line-height:1.7;padding-top:16px;border-top:1px dashed var(--line-2);opacity:0;transition:opacity .28s}
  .dv-reveal.show{opacity:1}
  .dv-reveal .en{font-family:var(--font-serif);color:var(--ink);font-weight:600}
  .dv-reveal .ar{color:var(--ink-faint);margin:0 4px}

  .type-prompt{text-align:center;margin:10px 0 4px}
  .type-kick{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:14px}
  .type-tr{font-family:var(--font-serif);font-weight:600;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;color:var(--ink);max-width:20ch;margin:0 auto}
  .type-in-wrap{margin:28px auto 0;max-width:420px}
  .type-in{width:100%;padding:16px 18px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--bg-2);color:var(--ink);font-size:1.2rem;text-align:center;outline:none;transition:.15s}
  .type-in::placeholder{color:var(--ink-faint)}
  .type-in:focus{border-color:var(--accent)}
  .type-in.ok{border-color:var(--success);background:var(--success-soft)}
  .type-in.no{border-color:var(--danger);background:var(--danger-soft)}
  .type-fb{text-align:center;margin-top:16px;min-height:26px;font-size:.95rem;color:var(--ink-dim)}
  .type-fb .fb-ok{color:var(--success);font-weight:600}
  .type-fb .fb-no{color:var(--danger);font-weight:600}
  .type-fb .ans{color:var(--ink);font-family:var(--font-serif);font-weight:600}
  .type-actions{display:flex;gap:10px;justify-content:center;margin:18px auto 0;max-width:420px}
  .type-btn{flex:1;padding:15px;border-radius:13px;font-weight:600;font-size:1rem;transition:.14s;border:1px solid transparent}

  .fb-en{font-family:var(--font-serif);font-weight:600;font-size:1.15rem;color:var(--ink)}

  .done .d-badge.good{background:var(--success-soft);color:var(--success)}

  .done .d-score small{font-size:1.4rem;color:var(--ink-dim);font-family:var(--font-sans)}
  .done .d-sub{color:var(--ink-dim);font-size:.95rem;margin-bottom:26px;line-height:1.5}

  .chip{padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);font-size:.86rem;color:var(--ink-dim)}

  .chip.ok b{color:var(--success)} .chip.no b{color:var(--accent)}

  .da{padding:15px 24px;border-radius:13px;font-weight:600;font-size:.97rem;transition:.14s;border:1px solid transparent}
  .da.primary{background:var(--accent);color:#2a1e05}
  .da.primary:hover{background:#f5bf5a}
  .da.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
  .da.sec:hover{background:var(--surface-2)}

  .foot{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .foot small{color:var(--ink-faint);font-size:.78rem;line-height:1.5}
  .ghost-link{font-size:.82rem;color:var(--ink-dim);padding:7px 11px;border-radius:9px;transition:.15s;border:1px solid transparent}
  .ghost-link:hover{color:var(--ink);background:var(--surface);border-color:var(--line)}

    .flashcard{transition:none}

const UNIT_SIZE = 25;
const BASE_COUNT = WORDS.length;
const VERB_COUNT = 600;              // first 600 = verbs (example sentences + derived forms)
const YDS_DAYS = [20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20, 20];        // word count per YDS day
function getUnits(){
  const arr=[];
  for(let s=0;s<VERB_COUNT;s+=UNIT_SIZE) arr.push({kind:'fiil', start:s, len:Math.min(UNIT_SIZE, VERB_COUNT-s)});
  let s=VERB_COUNT;
  for(let d=0;d<YDS_DAYS.length;d++){ arr.push({kind:'yds', day:d+1, start:s, len:YDS_DAYS[d]}); s+=YDS_DAYS[d]; }
  for(let cs=BASE_COUNT; cs<WORDS.length; cs+=UNIT_SIZE) arr.push({kind:'custom', start:cs, len:Math.min(UNIT_SIZE, WORDS.length-cs)});
  return arr;
}
function unitCount(){ return getUnits().length; }
function unitInfo(u){
  const U=getUnits(), un=U[u]; if(!un) return {no:'', tag:'fiil'};
  if(un.kind==='fiil') return {no:'Ünite '+(un.start/UNIT_SIZE+1), tag:'fiil'};
  if(un.kind==='yds') return {no:un.day+'. Gün', tag:'yds'};
  const cs=U.filter(x=>x.kind==='custom'); return {no:'Kelimelerim'+(cs.length>1?' '+(cs.indexOf(un)+1):''), tag:'custom'};
}

/* ---- user word edits + custom words ---- */
const WEKEY='yds_wedit_v1', WAKEY='yds_wadd_v1';
let wedit={}, wadd=[]; let wet=null, wat=null;
function saveWedit(){ clearTimeout(wet); wet=setTimeout(()=>sSet(WEKEY, JSON.stringify(wedit)),150); }
function saveWadd(){ clearTimeout(wat); wat=setTimeout(()=>sSet(WAKEY, JSON.stringify(wadd)),150); }
function applyWordData(){
  for(const k in wedit){ const i=+k; if(i>=0 && i<BASE_COUNT && Array.isArray(wedit[k])) WORDS[i]=[String(wedit[k][0]), String(wedit[k][1])]; }
  for(let k=0;k<wadd.length;k++) WORDS[BASE_COUNT+k]=[String(wadd[k][0]), String(wadd[k][1])];
  WORDS.length = BASE_COUNT + wadd.length;
}

/* ---- groups + custom-word deletion ---- */
const GKEY='yds_groups_v1'; let groups=[]; let gt=null;
function saveGroups(){ clearTimeout(gt); gt=setTimeout(()=>sSet(GKEY, JSON.stringify(groups)),150); }
function deleteCustom(pos){
  const delId = BASE_COUNT + pos;
  const shift = (obj)=>{ delete obj[delId]; Object.keys(obj).map(Number).filter(k=>k>delId).sort((a,b)=>a-b).forEach(k=>{ obj[k-1]=obj[k]; delete obj[k]; }); };
  shift(progress); shift(hidden);
  for(const g of groups){ g.ids = g.ids.filter(id=>id!==delId).map(id=> id>delId? id-1 : id); }
  wadd.splice(pos,1);
  saveWadd(); save(); saveHidden(); saveGroups(); applyWordData();
}
const KEY = 'yds_srs_v2';
const OLDKEY = 'yds_verbs_progress_v1';
const DAY = 86400000;
const IV = {1:0, 2:1, 3:3, 4:7, 5:16};   // days until next due when entering a box

let progress = {};                        // id -> {b:1..5, d:dueMs}
const memStore = {};

async function sGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in memStore)?memStore[k]:null; } }
async function sSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memStore[k]=v; } }

/* ---- daily goal + streak ---- */
const SKEY = 'yds_stats_v1';
let stats = { goal:25, actDay:'', actCount:0, streak:0, best:0, lastDay:'' };
let stt=null;
function saveStats(){ clearTimeout(stt); stt=setTimeout(()=>sSet(SKEY, JSON.stringify(stats)),160); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayDiff(a,b){ const p=a.split('-').map(Number), q=b.split('-').map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/DAY); }
function bumpActivity(){ const t=todayStr(); if(stats.actDay!==t){ stats.actDay=t; stats.actCount=0; } stats.actCount++; if(stats.lastDay!==t){ const d=stats.lastDay?dayDiff(stats.lastDay,t):999; stats.streak=(d===1)?(stats.streak||0)+1:1; stats.lastDay=t; if(stats.streak>(stats.best||0)) stats.best=stats.streak; } saveStats(); }
function currentStreak(){ if(!stats.lastDay) return 0; const d=dayDiff(stats.lastDay, todayStr()); return (d===0||d===1)?(stats.streak||0):0; }
function todayCount(){ return stats.actDay===todayStr()?(stats.actCount||0):0; }
function goalVal(){ return stats.goal||20; }

/* ---- hidden (bir daha gösterme) ---- */
const HKEY = 'yds_hidden_v1';
let hidden = {};                 // id -> 1
let ht=null;
function saveHidden(){ clearTimeout(ht); ht=setTimeout(()=>sSet(HKEY, JSON.stringify(hidden)),160); }
function isHidden(id){ return !!hidden[id]; }
function hideWord(id){ hidden[id]=1; saveHidden(); }
function unhideWord(id){ delete hidden[id]; saveHidden(); }
function hiddenCount(){ return Object.keys(hidden).length; }
function hiddenIds(){ return Object.keys(hidden).map(Number).sort((a,b)=>a-b); }

async function load(){
  const raw = await sGet(KEY);
  if(raw){ try{ progress = JSON.parse(raw)||{}; }catch(e){ progress={}; } }
  else {
    const old = await sGet(OLDKEY);
    if(old){ try{ const o = JSON.parse(old)||{}; const now = Date.now();
      for(const id in o){ const v=o[id]; if(v==='known') progress[id]={b:5,d:now}; else if(v==='learning') progress[id]={b:2,d:now}; }
      save();
    }catch(e){} }
  }
  const sraw = await sGet(SKEY);
  if(sraw){ try{ const s=JSON.parse(sraw); if(s&&typeof s==='object') stats=Object.assign(stats,s); }catch(e){} }
  if(stats.goal===20) stats.goal=25;
  const hraw = await sGet(HKEY);
  if(hraw){ try{ const h=JSON.parse(hraw); if(h&&typeof h==='object') hidden=h; }catch(e){} }
  const weraw = await sGet(WEKEY);
  if(weraw){ try{ const o=JSON.parse(weraw); if(o&&typeof o==='object') wedit=o; }catch(e){} }
  const waraw = await sGet(WAKEY);
  if(waraw){ try{ const a=JSON.parse(waraw); if(Array.isArray(a)) wadd=a; }catch(e){} }
  const graw = await sGet(GKEY);
  if(graw){ try{ const a=JSON.parse(graw); if(Array.isArray(a)) groups=a; }catch(e){} }
  applyWordData();
}
let st=null;
function save(){ clearTimeout(st); st=setTimeout(()=>sSet(KEY, JSON.stringify(progress)),160); }

function boxOf(id){ const p=progress[id]; return p?p.b:0; }
function dueOf(id){ const p=progress[id]; return p?p.d:0; }
function rate(id, ok){ const cur=boxOf(id); const nb = ok ? Math.min(5,cur+1) : 1; const p=progress[id]||{}; progress[id]={b:nb, d:Date.now()+IV[nb]*DAY, seen:(p.seen||0)+1, ok:(p.ok||0)+(ok?1:0), no:(p.no||0)+(ok?0:1)}; save(); bumpActivity(); }
function famOf(id){ return FAM[id]||[]; }

function isDone(id){ return isHidden(id) || boxOf(id)>=5; }
function val(id){ return isHidden(id) ? 5 : Math.min(boxOf(id),5); }
function studiedCount(){ let n=0; for(let i=0;i<WORDS.length;i++) if(isHidden(i)||boxOf(i)>=1) n++; return n; }
function masteredCount(){ let n=0; for(let i=0;i<WORDS.length;i++) if(isDone(i)) n++; return n; }
function weightedPct(){ let s=0; for(let i=0;i<WORDS.length;i++) s+=val(i); return Math.round(s/(WORDS.length*5)*100); }
function unitWords(u){ const un=getUnits()[u]; if(!un) return []; const out=[]; for(let i=un.start;i<un.start+un.len && i<WORDS.length;i++) out.push({id:i, en:WORDS[i][0], tr:WORDS[i][1]}); return out; }
function unitMastered(w){ return w.filter(x=>isDone(x.id)).length; }
function unitWeighted(w){ let s=0; w.forEach(x=>s+=val(x.id)); return Math.round(s/(w.length*5)*100); }
function dueList(){ const now=Date.now(); const a=[]; for(let i=0;i<WORDS.length;i++){ if(isHidden(i)) continue; const b=boxOf(i); if(b>=1&&b<5&&dueOf(i)<=now) a.push(i); } a.sort((x,y)=>dueOf(x)-dueOf(y)); return a; }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tShort(t){ return ({'İsim':'i.','Sıfat':'s.','Zarf':'z.','Bağlaç':'bağ.','Fiil':'f.','Modal':'mod.','Edat':'edat','PV':'PV','Kalıp':'kalıp'})[t]||t; }

/* ---- transfer / backup: move all progress between devices via a code ---- */
function backupPayload(){ return { app:'yds600', v:1, t:Date.now(), progress, stats, hidden, wedit, wadd, groups }; }
function encodeBackup(){ return btoa(unescape(encodeURIComponent(JSON.stringify(backupPayload())))); }
async function applyBackup(code){
  let obj;
  try{ obj = JSON.parse(decodeURIComponent(escape(atob((code||'').trim())))); }
  catch(e){ return {ok:false, msg:'Kod okunamadı. Tümünü eksiksiz kopyaladığından emin ol.'}; }
  if(!obj || typeof obj!=='object' || obj.app!=='yds600'){ return {ok:false, msg:'Bu geçerli bir 600 Fiil yedek kodu değil.'}; }
  await sSet(KEY, JSON.stringify(obj.progress||{}));
  await sSet(SKEY, JSON.stringify(obj.stats||{}));
  await sSet(HKEY, JSON.stringify(obj.hidden||{}));
  await sSet(WEKEY, JSON.stringify(obj.wedit||{}));
  await sSet(WAKEY, JSON.stringify(obj.wadd||[]));
  await sSet(GKEY, JSON.stringify(obj.groups||[]));
  return {ok:true};
}

function statBuckets(){ const b={mastered:[],mid:[],learning:[],'new':[]}; for(let i=0;i<WORDS.length;i++){ if(isHidden(i)) continue; const l=levelOf(i); if(b[l]) b[l].push(i); } return b; }

function saveEdit(id){
  const enEl=document.getElementById('edEn_'+id), trEl=document.getElementById('edTr_'+id);
  const en=(enEl&&enEl.value||'').trim(), tr=(trEl&&trEl.value||'').trim();
  if(!en||!tr) return;
  if(id<BASE_COUNT){ wedit[id]=[en,tr]; saveWedit(); } else { wadd[id-BASE_COUNT]=[en,tr]; saveWadd(); }
  applyWordData(); edState.editing=null; renderEditor();
}
function addWord(){
  const enEl=document.getElementById('adEn'), trEl=document.getElementById('adTr');
  const en=(enEl&&enEl.value||'').trim(), tr=(trEl&&trEl.value||'').trim();
  if(!en||!tr){ edState.msg='Hem İngilizce hem Türkçe alanını doldur.'; renderEditor(); return; }
  wadd.push([en,tr]); saveWadd(); applyWordData();
  const newId = BASE_COUNT + wadd.length - 1;
  let where='“Kelimelerim”';
  if(edState.addGroup>=0 && edState.addGroup<groups.length){ if(!groups[edState.addGroup].ids.includes(newId)){ groups[edState.addGroup].ids.push(newId); saveGroups(); } where='“'+groups[edState.addGroup].name+'” grubu'; }

  t.innerHTML = `<span>${esc(msg)}</span>${undoFn?'<button id="toastUndo">geri al</button>':''}`;

    const w=words[idx];
    frontText.textContent=w.en; backText.textContent=w.tr;
    card.classList.remove('flip');
    card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
    document.getElementById('fCount').textContent=`${idx+1} / ${total}`;
    document.getElementById('fBar').style.width=(idx/total*100)+'%';
    renderPips(w.id); renderFam(w);
  }
  function flip(){ card.classList.toggle('flip'); }
  function rateCard(ok){
    const w=words[idx]; rate(w.id, ok);
    if(ok){ known++; document.getElementById('sKnow').textContent=known; }
    else { missed.push(w); document.getElementById('sAgain').textContent=missed.length; }
    idx++;
    if(idx>=total) finish(); else showCard();
  }
  function finish(){ document.getElementById('fBar').style.width='100%'; renderFlashDone({total,known,missed,ctx}); }

  card.addEventListener('click', flip);
  document.getElementById('btnKnow').addEventListener('click', ()=>rateCard(true));
  document.getElementById('btnAgain').addEventListener('click', ()=>rateCard(false));
  document.getElementById('fBack').addEventListener('click', ctx.back);
  document.getElementById('hideWord').addEventListener('click', ()=>{
    const w=words[idx]; hideWord(w.id);
    showToast(`"${w.en}" çıkarıldı`, ()=>unhideWord(w.id));
    idx++; if(idx>=total) finish(); else showCard();
  });
  keyHandler=(e)=>{
    const onBtn = e.target.tagName==='BUTTON';
    if(e.key===' '||e.key==='Enter'){ if(onBtn) return; e.preventDefault(); flip(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); rateCard(true); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); rateCard(false); }
  };
  showCard();
}

function startQuiz(words, ctx){
  keyHandler=null;

  function answer(el, w, els){

/* ---------------- TYPING ---------------- */
function startTyping(words, ctx){
  keyHandler=null;
  if(!words.length){ renderEmptyStudy(ctx); return; }
  const qs=shuffle(words); const total=qs.length; let i=0, correct=0; const missed=[];

  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="tBack">‹ Çık</button>
      <div><div class="st-title">${esc(ctx.label)} · Yaz</div><div class="st-sub">Anlamı gör, İngilizcesini yaz</div></div>
      <div class="st-count" id="tCount"></div>
    </div>
    <div class="st-bar"><i id="tBar"></i></div>
    <div id="tBody"></div>`;
  document.getElementById('tBack').addEventListener('click', ctx.back);

  function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/^to\s+/,'').replace(/[.,;!?]+$/,''); }

  function showQ(){
    const w=qs[i];
    document.getElementById('tCount').textContent=`${i+1} / ${total}`;
    document.getElementById('tBar').style.width=(i/total*100)+'%';
    document.getElementById('tBody').innerHTML = `
      <div class="type-prompt"><div class="type-kick">Bu anlamın İngilizce fiili?</div><div class="type-tr">${esc(w.tr)}</div></div>

      <div class="type-fb" id="tFb"></div>
      <div class="type-actions" id="tActions">
        <button class="type-btn skip" id="tSkip">Bilmiyorum</button>
        <button class="type-btn submit" id="tSubmit">Kontrol et</button>
      </div>`;
    const inp=document.getElementById('tIn');
    setTimeout(()=>inp.focus(),30);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    document.getElementById('tSubmit').addEventListener('click', submit);
    document.getElementById('tSkip').addEventListener('click', ()=> finishQ(false, true));
  }
  function submit(){ const inp=document.getElementById('tIn'); if(!inp.value.trim()){ inp.focus(); return; } finishQ(norm(inp.value)===norm(qs[i].en), false); }
  function finishQ(ok, skipped){
    const w=qs[i]; const inp=document.getElementById('tIn');

    rate(w.id, ok);
    if(ok) correct++; else missed.push(w);

    const last=(i===total-1);
    document.getElementById('tActions').innerHTML = `<button class="type-next" id="tNext">${last?'Sonuçları gör':'Sonraki ›'}</button>`;
    const nx=document.getElementById('tNext'); nx.focus();
    nx.addEventListener('click', ()=>{ i++; if(i>=total) finish(); else showQ(); });
  }
  function finish(){
    document.getElementById('tBar').style.width='100%';
    const pct=Math.round(correct/total*100);
    let badge,title;
    if(pct>=90){badge='good';title='Harika yazım! ✍️';}
    else if(pct>=70){badge='good';title='Çok iyi';}
    else if(pct>=50){badge='mid';title='Fena değil';}
    else {badge='mid';title='Biraz daha pratik';}
    app.innerHTML = `
      <div class="done">
        <div class="d-badge ${badge}">${pct>=70?'✓':'↻'}</div>
        <div class="d-title">${title}</div>
        <div class="d-score">${correct}<small> / ${total}</small></div>
        <div class="done-chips">
          <span class="chip ok"><b>${correct}</b>doğru</span>
          <span class="chip no"><b>${total-correct}</b>yanlış</span>
          <span class="chip"><b>%${pct}</b>başarı</span>
        </div>
        <div class="d-sub">Yazarak çalışmak en zorudur — takıldıkların erken tekrara döner.</div>
        <div class="done-actions">
          ${missed.length?`<button class="da primary" id="tRedo">${missed.length} kelimeyi tekrar yaz</button>`:''}
          <button class="da sec" id="tBackBtn">Geri dön</button>
          <button class="da sec" id="tHome">Ana sayfa</button>
        </div>
      </div>`;
    if(missed.length) document.getElementById('tRedo').addEventListener('click', ()=> startTyping(shuffle(missed), ctx));
    document.getElementById('tBackBtn').addEventListener('click', ctx.back);
    document.getElementById('tHome').addEventListener('click', ()=> go({name:'home'}));
  }
  showQ();
}

/* ---------------- DERIVATION QUIZ (doğru türevi seç) ---------------- */
function buildDerivQuestions(words){
  const allowed=['İsim','Sıfat','Zarf'];
  const pool={};
  for(const id in FAM){ for(const f of FAM[id]){ if(allowed.indexOf(f[2])>=0){ (pool[f[2]]=pool[f[2]]||[]).push(f[0]); } } }
  const qs=[];
  words.forEach(w=>{ famOf(w.id).forEach(f=>{ if(allowed.indexOf(f[2])>=0) qs.push({verb:w.en, verbTr:w.tr, ans:f[0], tr:f[1], type:f[2]}); }); });
  return {qs:shuffle(qs), pool};
}
function startDeriv(words, ctx){
  keyHandler=null;
  const built=buildDerivQuestions(words); const pool=built.pool;
  if(!built.qs.length){
    app.innerHTML = `
      <div class="st-head"><button class="back" id="dBack">‹ Çık</button><div><div class="st-title">${esc(ctx.label)} · Türev</div></div></div>
      <div class="done"><div class="d-badge mid">—</div><div class="d-title">Bu ünitede türev yok</div><div class="d-sub">Bu ünitedeki fiillerin isim, sıfat veya zarf türevi bulunmuyor. Başka bir üniteyi deneyebilirsin.</div><div class="done-actions"><button class="da sec" id="dBack2">Geri dön</button></div></div>`;
    document.getElementById('dBack').addEventListener('click', ctx.back);
    document.getElementById('dBack2').addEventListener('click', ctx.back);
    return;
  }
  const total=Math.min(built.qs.length, 20); const items=built.qs.slice(0,total); let i=0, score=0;
  const tl={'İsim':'isim (noun)','Sıfat':'sıfat (adjective)','Zarf':'zarf (adverb)'};
  app.innerHTML = `
    <div class="st-head"><button class="back" id="dBack">‹ Çık</button><div><div class="st-title">${esc(ctx.label)} · Türev</div><div class="st-sub">Fiilin doğru türevini seç</div></div><div class="st-count" id="dCount"></div></div>
    <div class="st-bar"><i id="dBar"></i></div>
    <div id="dBody"></div>`;
  document.getElementById('dBack').addEventListener('click', ctx.back);
  function options(q){ const p=pool[q.type]; const s=new Set([q.ans]); let g=0; while(s.size<4&&g<400){ s.add(p[Math.floor(Math.random()*p.length)]); g++; } return shuffle([...s]); }
  function showQ(){
    const q=items[i];
    document.getElementById('dCount').textContent=`${i+1} / ${total}`;
    document.getElementById('dBar').style.width=(i/total*100)+'%';
    const opts=options(q); const L=['A','B','C','D'];
    document.getElementById('dBody').innerHTML = `
      <div class="q-prompt"><div class="q-kick">Bu fiilin ${tl[q.type]} hâli?</div><div class="q-word">${esc(q.verb)}</div></div>
      <div class="q-opts">${opts.map((o,k)=>`<button class="opt" data-en="${esc(o)}"><span class="opt-key">${L[k]}</span><span>${esc(o)}</span><span class="opt-mark"></span></button>`).join('')}</div>
      <div class="dv-reveal" id="dvReveal"></div>
      <div class="q-next-wrap" id="dNextWrap"></div>`;
    const els=[...document.querySelectorAll('.opt')];
    els.forEach(el=> el.addEventListener('click', ()=> answer(el, q, els)));
    keyHandler=(e)=>{ const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()]; if(m!=null&&els[m]&&!els[m].disabled) els[m].click(); };
  }
  function answer(el, q, els){
    const ok=el.dataset.en===q.ans;
    els.forEach(o=>{ o.disabled=true; if(o.dataset.en===q.ans){ o.classList.add('correct'); o.querySelector('.opt-mark').textContent='✓'; } });
    if(ok){ score++; } else { el.classList.add('wrong'); el.querySelector('.opt-mark').textContent='✕'; }
    bumpActivity();
    const rev=document.getElementById('dvReveal');
    const list = els.map(e=>e.dataset.en).map(v=>`<div class="om-row ${v===q.ans?'ok':''}"><span class="om-en">${esc(v)}</span><span class="om-tr">${esc(FORM_MEAN[v]||'')}</span></div>`).join('');
    rev.innerHTML = `<div class="dv-head"><span class="en">${esc(q.verb)}</span> — ${esc(q.verbTr)}</div><div class="opt-means">${list}</div>`;
    rev.classList.add('show');
    const last=(i===total-1);
    document.getElementById('dNextWrap').innerHTML=`<button class="q-next" id="dNext">${last?'Sonuçları gör':'Sonraki ›'}</button>`;
    const nx=document.getElementById('dNext'); nx.focus();
    const adv=()=>{ i++; if(i>=total) finish(); else showQ(); };
    nx.addEventListener('click', adv);
    keyHandler=(e)=>{ if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); adv(); } };
  }
  function finish(){ document.getElementById('dBar').style.width='100%'; renderScore('Türev', score, total, ()=>startDeriv(words,ctx), ctx); }
  showQ();
}

/* ---------------- INIT ---------------- */
(async function(){ await load(); renderHome(); })();
</script>
