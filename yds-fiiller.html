<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YDS 600 Fiil · Çalışma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1826; --bg-2:#221F33; --surface:#2A2740; --surface-2:#332F4C;
    --paper:#F4EFE3; --paper-line:#E4DCC8;
    --ink:#ECE7DB; --ink-dim:#9E99B4; --ink-faint:#6E6A85;
    --card-ink:#231F2C; --card-ink-dim:#6a6472;
    --accent:#F2B33D; --accent-soft:rgba(242,179,61,.16);
    --success:#54C79A; --success-soft:rgba(84,199,154,.16);
    --danger:#EC6A66; --danger-soft:rgba(236,106,102,.16);
    --blue:#8fb0ff; --blue-soft:rgba(120,160,255,.16);
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.14);
    --font-serif:'Fraunces','Georgia','Times New Roman',serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);color:var(--ink);
    background:
      radial-gradient(1100px 600px at 50% -8%, #2b2740 0%, rgba(43,39,64,0) 60%),
      radial-gradient(700px 500px at 50% 6%, var(--accent-soft) 0%, rgba(242,179,61,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 64px;min-height:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{font-family:var(--font-serif);font-weight:600;font-size:1.32rem;letter-spacing:-.01em;white-space:nowrap}
  .brand .tag{font-size:.72rem;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}

  .overview{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .ov-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
  .ov-num{font-family:var(--font-serif);font-size:2.1rem;font-weight:600;line-height:1}
  .ov-num small{font-size:1rem;color:var(--ink-dim);font-family:var(--font-sans);font-weight:500}
  .ov-label{font-size:.86rem;color:var(--ink-dim);text-align:right}
  .ov-label b{color:var(--accent);font-weight:600}
  .ov-foot{margin-top:11px;font-size:.8rem;color:var(--ink-faint)}
  .bar{height:9px;border-radius:99px;background:var(--surface);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E7A62F,var(--accent));transition:width .5s cubic-bezier(.2,.7,.2,1)}

  .review-btn{display:flex;width:100%;align-items:center;gap:14px;text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-bottom:26px;transition:.16s}
  .review-btn:hover{border-color:var(--line-2);background:var(--surface)}
  .review-btn .rb-ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.15rem}
  .review-btn .rb-t{font-weight:600;font-size:.98rem}
  .review-btn .rb-s{font-size:.82rem;color:var(--ink-dim);margin-top:1px}
  .review-btn .rb-count{margin-left:auto;font-family:var(--font-serif);font-weight:600;font-size:1.35rem;color:var(--accent)}
  .review-btn[disabled]{opacity:.5;cursor:default}
  .review-btn[disabled]:hover{border-color:var(--line);background:var(--bg-2)}

  .section-label{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin:0 2px 12px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
  .unit{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px 15px 16px;transition:.16s;overflow:hidden}
  .unit:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--surface-2)}
  .unit .u-no{font-family:var(--font-serif);font-size:1.28rem;font-weight:600;letter-spacing:-.01em}
  .unit .u-range{font-size:.76rem;color:var(--ink-faint);margin-top:1px;font-variant-numeric:tabular-nums}
  .unit .u-bar{height:5px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden;margin:14px 0 8px}
  .unit .u-bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
  .unit .u-stat{font-size:.78rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .unit.done{border-color:rgba(84,199,154,.45)}
  .unit.done .u-bar > i{background:var(--success)}
  .unit.done .u-check{position:absolute;top:13px;right:13px;color:var(--success);font-size:.95rem}

  .st-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--ink-dim);padding:8px 12px 8px 9px;border-radius:10px;border:1px solid var(--line);transition:.15s;white-space:nowrap}
  .back:hover{color:var(--ink);background:var(--surface)}
  .st-title{font-weight:600;font-size:.98rem}
  .st-sub{font-size:.8rem;color:var(--ink-faint)}
  .st-count{margin-left:auto;font-size:.85rem;color:var(--ink-dim);font-variant-numeric:tabular-nums;text-align:right}
  .st-bar{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-bottom:22px}
  .st-bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E7A62F,var(--accent));transition:width .35s ease}

  .u-menu-head{text-align:center;margin:8px 0 28px}
  .u-menu-head .um-no{font-family:var(--font-serif);font-size:2.5rem;font-weight:600;line-height:1.05}
  .u-menu-head .um-range{color:var(--ink-dim);font-size:.95rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .u-menu-head .um-prog{display:inline-flex;gap:14px;margin-top:16px;font-size:.85rem;color:var(--ink-dim)}
  .u-menu-head .um-prog b{color:var(--ink);font-weight:600}
  .mode-pick{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:560px){.mode-pick{grid-template-columns:repeat(3,1fr)}}
  .mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:5px;padding:20px 20px 22px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);transition:.16s}
  .mode:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--surface-2)}
  .mode .m-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;margin-bottom:6px}
  .mode.learn .m-ic{background:var(--accent-soft);color:var(--accent)}
  .mode.test .m-ic{background:var(--success-soft);color:var(--success)}
  .mode.write .m-ic{background:var(--blue-soft);color:var(--blue)}
  .mode .m-t{font-family:var(--font-serif);font-size:1.3rem;font-weight:600}
  .mode .m-d{font-size:.84rem;color:var(--ink-dim);line-height:1.4}
  .fam-cta{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);font-weight:600;font-size:.92rem;transition:.15s}
  .fam-cta:hover{color:var(--ink);border-color:var(--line-2);background:var(--surface)}

  .flash-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:.82rem;color:var(--ink-dim)}
  .box-pips{display:inline-flex;gap:5px;align-items:center}
  .box-pips i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
  .box-pips i.on{background:var(--accent)}
  .fm-counts{display:inline-flex;gap:16px}
  .fm-counts b{font-family:var(--font-serif);font-weight:600;font-size:1rem}
  .ls-know b{color:var(--success)} .ls-again b{color:var(--accent)}

  .card-area{perspective:1600px;margin-bottom:22px}
  .flashcard{position:relative;width:100%;min-height:clamp(258px,42vh,360px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.2,1);cursor:pointer}
  .flashcard.flip{transform:rotateY(180deg)}
  .flashcard.enter{animation:cardIn .4s cubic-bezier(.2,.7,.2,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 26px;border-radius:22px;background:var(--paper);box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 26px 55px -22px rgba(0,0,0,.75), 0 0 46px -12px var(--accent-soft);border:1px solid var(--paper-line)}
  .face .kicker{position:absolute;top:18px;left:0;right:0;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--card-ink-dim);font-weight:600}
  .face.back{transform:rotateY(180deg);background:#EFE9DB}
  .word{font-family:var(--font-serif);color:var(--card-ink);font-weight:600;font-size:clamp(2.3rem,8.5vw,4rem);line-height:1.02;letter-spacing:-.02em;word-break:break-word}
  .meaning{color:var(--card-ink);font-weight:500;font-size:clamp(1.4rem,5.4vw,2.15rem);line-height:1.25;max-width:22ch}
  .flip-hint{position:absolute;bottom:16px;left:0;right:0;font-size:.76rem;color:var(--card-ink-dim);display:flex;align-items:center;justify-content:center;gap:6px}
  .flip-hint svg{opacity:.7}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:14px;font-weight:600;font-size:1rem;transition:.14s;border:1px solid transparent}
  .btn:active{transform:translateY(1px)}
  .btn.know{background:var(--success);color:#0d2b20}
  .btn.know:hover{background:#63d3a7}
  .btn.again{background:transparent;color:var(--ink);border-color:var(--line-2)}
  .btn.again:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}
  .btn small{font-weight:500;opacity:.6;font-size:.78rem}

  .fam-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink-dim);font-size:.86rem;font-weight:600;transition:.15s}
  .fam-toggle:hover{color:var(--ink);border-color:var(--line-2)}
  .fam-toggle .fchev{transition:transform .25s}
  .fam-toggle.open .fchev{transform:rotate(180deg)}
  .fam-panel{max-height:0;overflow:hidden;transition:max-height .32s ease}
  .fam-panel.open{max-height:720px}
  .fam-list{padding:12px 0 2px;display:grid;gap:8px}
  .fam-item{display:flex;align-items:baseline;gap:10px;font-size:.9rem;padding:9px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
  .fam-item .fw{font-weight:600;color:var(--ink)}
  .fam-item .fm{color:var(--ink-dim);flex:1}
  .fam-item .ft{font-size:.66rem;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}

  .kbd-hint{text-align:center;font-size:.76rem;color:var(--ink-faint);margin-top:16px}
  .kbd{display:inline-block;padding:1px 7px;border:1px solid var(--line-2);border-radius:6px;font-size:.72rem;color:var(--ink-dim);background:var(--surface);margin:0 1px}

  .q-prompt{text-align:center;margin:6px 0}
  .q-prompt .q-kick{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:14px}
  .q-word{font-family:var(--font-serif);font-weight:600;font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
  .q-opts{display:grid;gap:11px;margin-top:28px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:1rem;transition:.14s;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--line-2);background:var(--surface-2)}
  .opt:disabled{cursor:default}
  .opt .opt-key{width:24px;height:24px;flex:none;border-radius:7px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:.8rem;color:var(--ink-dim);font-weight:600}
  .opt.correct{border-color:var(--success);background:var(--success-soft);color:#d6f5e8}
  .opt.correct .opt-key{background:var(--success);color:#0d2b20}
  .opt.wrong{border-color:var(--danger);background:var(--danger-soft);color:#fbdad9}
  .opt.wrong .opt-key{background:var(--danger);color:#3a1211}
  .opt .opt-mark{margin-left:auto;font-size:1rem;opacity:0}
  .opt.correct .opt-mark,.opt.wrong .opt-mark{opacity:1}
  .q-next-wrap{margin-top:22px;min-height:56px;display:flex;justify-content:center}
  .q-next{padding:15px 34px;border-radius:13px;background:var(--accent);color:#2a1e05;font-weight:600;font-size:1rem;transition:.14s}
  .q-next:hover{background:#f5bf5a}

  .type-prompt{text-align:center;margin:10px 0 4px}
  .type-kick{font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:14px}
  .type-tr{font-family:var(--font-serif);font-weight:600;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;color:var(--ink);max-width:20ch;margin:0 auto}
  .type-in-wrap{margin:28px auto 0;max-width:420px}
  .type-in{width:100%;padding:16px 18px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--bg-2);color:var(--ink);font-size:1.2rem;text-align:center;outline:none;transition:.15s}
  .type-in::placeholder{color:var(--ink-faint)}
  .type-in:focus{border-color:var(--accent)}
  .type-in.ok{border-color:var(--success);background:var(--success-soft)}
  .type-in.no{border-color:var(--danger);background:var(--danger-soft)}
  .type-fb{text-align:center;margin-top:16px;min-height:26px;font-size:.95rem;color:var(--ink-dim)}
  .type-fb .fb-ok{color:var(--success);font-weight:600}
  .type-fb .fb-no{color:var(--danger);font-weight:600}
  .type-fb .ans{color:var(--ink);font-family:var(--font-serif);font-weight:600}
  .type-actions{display:flex;gap:10px;justify-content:center;margin:18px auto 0;max-width:420px}
  .type-btn{flex:1;padding:15px;border-radius:13px;font-weight:600;font-size:1rem;transition:.14s;border:1px solid transparent}
  .type-btn.submit{background:var(--accent);color:#2a1e05}
  .type-btn.submit:hover{background:#f5bf5a}
  .type-btn.skip{background:transparent;color:var(--ink-dim);border-color:var(--line-2)}
  .type-btn.skip:hover{color:var(--ink);background:var(--surface)}
  .type-next{width:100%;max-width:420px;margin:0 auto;padding:15px;border-radius:13px;background:var(--accent);color:#2a1e05;font-weight:600;font-size:1rem;display:block}
  .type-next:hover{background:#f5bf5a}

  .fb-item{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
  .fb-head{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left;transition:.15s}
  .fb-head:hover{background:var(--surface-2)}
  .fb-en{font-family:var(--font-serif);font-weight:600;font-size:1.15rem;color:var(--ink)}
  .fb-tr{color:var(--ink-dim);font-size:.9rem;flex:1}
  .fb-badge{font-size:.72rem;color:var(--ink-faint);background:var(--bg-2);border:1px solid var(--line);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .fb-chev{color:var(--ink-faint);transition:transform .2s;flex:none}
  .fb-item.open .fb-chev{transform:rotate(180deg)}
  .fb-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .fb-item.open .fb-body{max-height:900px}
  .fb-body-inner{padding:12px 16px 14px;display:grid;gap:7px;border-top:1px solid var(--line)}

  .done{text-align:center;padding:20px 6px 8px;max-width:460px;margin:0 auto}
  .done .d-badge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:22px auto;font-size:2.2rem}
  .done .d-badge.good{background:var(--success-soft);color:var(--success)}
  .done .d-badge.mid{background:var(--accent-soft);color:var(--accent)}
  .done .d-title{font-family:var(--font-serif);font-size:1.9rem;font-weight:600;line-height:1.15;margin-bottom:10px}
  .done .d-score{font-family:var(--font-serif);font-size:3.4rem;font-weight:600;line-height:1;margin:6px 0 4px}
  .done .d-score small{font-size:1.4rem;color:var(--ink-dim);font-family:var(--font-sans)}
  .done .d-sub{color:var(--ink-dim);font-size:.95rem;margin-bottom:26px;line-height:1.5}
  .done-chips{display:flex;justify-content:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);font-size:.86rem;color:var(--ink-dim)}
  .chip b{font-family:var(--font-serif);font-weight:600;font-size:1.05rem;margin-right:4px}
  .chip.ok b{color:var(--success)} .chip.no b{color:var(--accent)}
  .done-actions{display:flex;flex-direction:column;gap:11px}
  @media(min-width:520px){.done-actions{flex-direction:row;justify-content:center;flex-wrap:wrap}}
  .da{padding:15px 24px;border-radius:13px;font-weight:600;font-size:.97rem;transition:.14s;border:1px solid transparent}
  .da.primary{background:var(--accent);color:#2a1e05}
  .da.primary:hover{background:#f5bf5a}
  .da.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
  .da.sec:hover{background:var(--surface-2)}

  .foot{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .foot small{color:var(--ink-faint);font-size:.78rem;line-height:1.5}
  .ghost-link{font-size:.82rem;color:var(--ink-dim);padding:7px 11px;border-radius:9px;transition:.15s;border:1px solid transparent}
  .ghost-link:hover{color:var(--ink);background:var(--surface);border-color:var(--line)}
  .confirm{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-dim)}
  .confirm .cf-yes{color:var(--danger);font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--danger-soft);background:var(--danger-soft)}
  .confirm .cf-no{padding:6px 12px;border-radius:8px;border:1px solid var(--line)}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
    .flashcard{transition:none}
  }
</style>
</head>
<body>

const UNIT_SIZE = 25;
const UNIT_COUNT = Math.ceil(WORDS.length / UNIT_SIZE);
const KEY = 'yds_srs_v2';
const OLDKEY = 'yds_verbs_progress_v1';
const DAY = 86400000;
const IV = {1:0, 2:1, 3:3, 4:7, 5:16};   // days until next due when entering a box

let progress = {};                        // id -> {b:1..5, d:dueMs}
const memStore = {};

async function sGet(k){ try{ if(window.storage && window.storage.get){ const r = await window.storage.get(k); return r?r.value:null; } }catch(e){} return (k in memStore)?memStore[k]:null; }
async function sSet(k,v){ try{ if(window.storage && window.storage.set){ await window.storage.set(k,v); return; } }catch(e){} memStore[k]=v; }

async function load(){
  const raw = await sGet(KEY);
  if(raw){ try{ progress = JSON.parse(raw)||{}; }catch(e){ progress={}; } return; }
  const old = await sGet(OLDKEY);
  if(old){ try{ const o = JSON.parse(old)||{}; const now = Date.now();
    for(const id in o){ const v=o[id]; if(v==='known') progress[id]={b:5,d:now}; else if(v==='learning') progress[id]={b:2,d:now}; }
    save();
  }catch(e){} }
}
let st=null;
function save(){ clearTimeout(st); st=setTimeout(()=>sSet(KEY, JSON.stringify(progress)),160); }

function boxOf(id){ const p=progress[id]; return p?p.b:0; }
function dueOf(id){ const p=progress[id]; return p?p.d:0; }
function rate(id, ok){ const cur=boxOf(id); const nb = ok ? Math.min(5,cur+1) : 1; progress[id]={b:nb, d:Date.now()+IV[nb]*DAY}; save(); }
function famOf(id){ return FAM[id]||[]; }

function studiedCount(){ let n=0; for(let i=0;i<WORDS.length;i++) if(boxOf(i)>=1) n++; return n; }
function masteredCount(){ let n=0; for(let i=0;i<WORDS.length;i++) if(boxOf(i)>=5) n++; return n; }
function weightedPct(){ let s=0; for(let i=0;i<WORDS.length;i++) s+=Math.min(boxOf(i),5); return Math.round(s/(WORDS.length*5)*100); }
function unitWords(u){ const s=u*UNIT_SIZE; return WORDS.slice(s,s+UNIT_SIZE).map((w,i)=>({id:s+i, en:w[0], tr:w[1]})); }
function unitMastered(w){ return w.filter(x=>boxOf(x.id)>=5).length; }
function unitWeighted(w){ let s=0; w.forEach(x=>s+=Math.min(boxOf(x.id),5)); return Math.round(s/(w.length*5)*100); }
function dueList(){ const now=Date.now(); const a=[]; for(let i=0;i<WORDS.length;i++){ const b=boxOf(i); if(b>=1&&b<5&&dueOf(i)<=now) a.push(i); } a.sort((x,y)=>dueOf(x)-dueOf(y)); return a; }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tShort(t){ return ({'İsim':'i.','Sıfat':'s.','Zarf':'z.','Bağlaç':'bağ.','Fiil':'f.','Modal':'mod.','Edat':'edat','PV':'PV','Kalıp':'kalıp'})[t]||t; }

const app = document.getElementById('app');
let view = {name:'home'};
let keyHandler = null;
document.addEventListener('keydown', e=>{ if(keyHandler) keyHandler(e); });
function go(v){ keyHandler=null; view=v; if(v.name==='home') renderHome(); else if(v.name==='unit') renderUnit(v.unit); window.scrollTo({top:0}); }

/* ---------------- HOME ---------------- */
function renderHome(){
  const mastered=masteredCount(), studied=studiedCount(), wp=weightedPct();
  const due=dueList().length;

  let cards='';
  for(let u=0;u<UNIT_COUNT;u++){
    const w=unitWords(u); const m=unitMastered(w); const p=unitWeighted(w); const isDone=m===w.length;
    const lo=u*UNIT_SIZE+1, hi=u*UNIT_SIZE+w.length;
    cards += `<button class="unit ${isDone?'done':''}" data-unit="${u}">
      ${isDone?'<span class="u-check">✓</span>':''}
      <div class="u-no">Ünite ${u+1}</div>
      <div class="u-range">${lo}–${hi}. fiiller</div>
      <div class="u-bar"><i style="width:${p}%"></i></div>
      <div class="u-stat">${m} / ${w.length} ustalaşıldı</div>
    </button>`;
  }

  app.innerHTML = `
    <div class="top">
      <div class="brand"><h1>600 Fiil</h1><span class="tag">YDS Sözlüğü</span></div>
    </div>

    <div class="overview">
      <div class="ov-row">
        <div class="ov-num">${mastered}<small> / ${WORDS.length}</small></div>
        <div class="ov-label">ustalaşılan fiil<br><b>%${wp}</b> genel ilerleme</div>
      </div>
      <div class="bar"><i style="width:${wp}%"></i></div>
      <div class="ov-foot">${studied} fiile çalışıldı</div>
    </div>

    <button class="review-btn" id="dueBtn" ${due?'':'disabled'}>
      <span class="rb-ic">↻</span>
      <span>
        <div class="rb-t">Bugünkü tekrar</div>
        <div class="rb-s">${due? 'Aralıklı tekrar zamanı gelen fiiller' : 'Şimdilik tekrar yok — yeni bir ünite çalış'}</div>
      </span>
      <span class="rb-count">${due}</span>
    </button>

    <div class="section-label">Üniteler · 25’erli</div>
    <div class="grid">${cards}</div>

    <div class="foot" id="foot">
      <small>İlerlemen bu cihazda kaydediliyor.<br>Bildikçe kelimeler seyrekleşir, şaşırdıkların erken döner.</small>
      <button class="ghost-link" id="resetBtn">İlerlemeyi sıfırla</button>
    </div>`;

  app.querySelectorAll('.unit').forEach(el=> el.addEventListener('click', ()=> go({name:'unit', unit:+el.dataset.unit})));
  const db=document.getElementById('dueBtn');
  if(due) db.addEventListener('click', ()=>{
    const ids=dueList();
    const words=ids.map(id=>({id, en:WORDS[id][0], tr:WORDS[id][1]}));
    startFlash(words, { label:'Tekrar', back:()=>go({name:'home'}) });
  });
  document.getElementById('resetBtn').addEventListener('click', showResetConfirm);
}

function showResetConfirm(){
  const foot=document.getElementById('foot');
  foot.innerHTML = `
    <small>Tüm ilerlemen silinsin mi? Bu geri alınamaz.</small>
    <span class="confirm">
      <button class="cf-yes" id="cfYes">Evet, sıfırla</button>
      <button class="cf-no" id="cfNo">Vazgeç</button>
    </span>`;
  document.getElementById('cfYes').addEventListener('click', ()=>{ progress={}; save(); renderHome(); });
  document.getElementById('cfNo').addEventListener('click', renderHome);
}

/* ---------------- UNIT MENU ---------------- */

  const w=unitWords(u); const m=unitMastered(w);
  const lo=u*UNIT_SIZE+1, hi=u*UNIT_SIZE+w.length;
  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="back">‹ Üniteler</button>
      <div><div class="st-title">Ünite ${u+1}</div><div class="st-sub">${lo}–${hi}. fiiller</div></div>
    </div>

      <div class="um-range">${w.length} fiil · ${lo}–${hi}</div>

  document.getElementById('back').addEventListener('click', ()=> go({name:'home'}));
  const ctx = { label:`Ünite ${u+1}`, back:()=>go({name:'unit',unit:u}) };
  document.getElementById('mLearn').addEventListener('click', ()=> startFlash(w.slice(), ctx));
  document.getElementById('mTest').addEventListener('click', ()=> startQuiz(w.slice(), ctx));
  document.getElementById('mWrite').addEventListener('click', ()=> startTyping(w.slice(), ctx));
  document.getElementById('famBtn').addEventListener('click', ()=> renderFamilyBrowser(u));
}

/* ---------------- FLASHCARDS ---------------- */
function startFlash(words, ctx){
  keyHandler=null;
  if(!words.length){ ctx.back(); return; }
  const total=words.length; let idx=0, known=0; const missed=[];

  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="fBack">‹ Çık</button>
      <div><div class="st-title">${esc(ctx.label)} · Öğren</div><div class="st-sub">Kartı çevir, kendini yokla</div></div>
      <div class="st-count" id="fCount"></div>
    </div>
    <div class="st-bar"><i id="fBar"></i></div>
    <div class="flash-meta">
      <span class="box-pips" id="pips" title="Bu kelimenin seviyesi"></span>
      <span class="fm-counts"><span class="ls-know">✓ <b id="sKnow">0</b></span><span class="ls-again">↻ <b id="sAgain">0</b></span></span>
    </div>
    <div class="card-area">
      <div class="flashcard" id="card" role="button" tabindex="0" aria-label="Kartı çevir">
        <div class="face front">
          <span class="kicker">İngilizce</span>
          <span class="word" id="frontText"></span>
          <span class="flip-hint">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            çevirmek için dokun
          </span>
        </div>
        <div class="face back"><span class="kicker">Türkçe</span><span class="meaning" id="backText"></span></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn again" id="btnAgain">Tekrar <small>öğreniyorum</small></button>
      <button class="btn know" id="btnKnow">Biliyorum <small>öğrendim</small></button>
    </div>
    <div id="famWrap"></div>
    <div class="kbd-hint"><span class="kbd">Boşluk</span> çevir · <span class="kbd">←</span> tekrar · <span class="kbd">→</span> biliyorum</div>`;

  const card=document.getElementById('card');
  const frontText=document.getElementById('frontText');
  const backText=document.getElementById('backText');
  const pipsEl=document.getElementById('pips');
  const famWrap=document.getElementById('famWrap');

  function renderPips(id){ const b=boxOf(id); pipsEl.innerHTML=[1,2,3,4,5].map(n=>`<i class="${n<=b?'on':''}"></i>`).join(''); }
  function renderFam(w){
    const forms=famOf(w.id);
    if(!forms.length){ famWrap.innerHTML=''; return; }
    famWrap.innerHTML = `
      <button class="fam-toggle" id="famToggle"><span>Kelime ailesi · ${forms.length} türev</span>
        <svg class="fchev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="fam-panel" id="famPanel"><div class="fam-list">${forms.map(f=>`<div class="fam-item"><span class="fw">${esc(f[0])}</span><span class="fm">${esc(f[1])}</span><span class="ft">${esc(tShort(f[2]))}</span></div>`).join('')}</div></div>`;
    const tg=document.getElementById('famToggle'), pn=document.getElementById('famPanel');
    tg.addEventListener('click', ()=>{ tg.classList.toggle('open'); pn.classList.toggle('open'); });
  }
  function showCard(){
    const w=words[idx];
    frontText.textContent=w.en; backText.textContent=w.tr;
    card.classList.remove('flip');
    card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
    document.getElementById('fCount').textContent=`${idx+1} / ${total}`;
    document.getElementById('fBar').style.width=(idx/total*100)+'%';
    renderPips(w.id); renderFam(w);
  }
  function flip(){ card.classList.toggle('flip'); }
  function rateCard(ok){
    const w=words[idx]; rate(w.id, ok);
    if(ok){ known++; document.getElementById('sKnow').textContent=known; }
    else { missed.push(w); document.getElementById('sAgain').textContent=missed.length; }
    idx++;
    if(idx>=total) finish(); else showCard();
  }
  function finish(){ document.getElementById('fBar').style.width='100%'; renderFlashDone({total,known,missed,ctx}); }

  card.addEventListener('click', flip);
  document.getElementById('btnKnow').addEventListener('click', ()=>rateCard(true));
  document.getElementById('btnAgain').addEventListener('click', ()=>rateCard(false));
  document.getElementById('fBack').addEventListener('click', ctx.back);
  keyHandler=(e)=>{
    const onBtn = e.target.tagName==='BUTTON';
    if(e.key===' '||e.key==='Enter'){ if(onBtn) return; e.preventDefault(); flip(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); rateCard(true); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); rateCard(false); }
  };
  showCard();
}

function renderFlashDone({total, known, missed, ctx}){
  keyHandler=null;
  const allKnown = missed.length===0;
  app.innerHTML = `
    <div class="done">
      <div class="d-badge ${allKnown?'good':'mid'}">${allKnown?'✓':'↻'}</div>
      <div class="d-title">${allKnown? 'Hepsini bildin! 🎉' : 'Tur tamamlandı'}</div>
      <div class="d-sub">${total} karttan <b style="color:var(--success)">${known}</b> tanesini bildin.${allKnown?'':` <b style="color:var(--accent)">${missed.length}</b> fiil tekrara ayrıldı.`}</div>
      <div class="done-actions">
        ${missed.length?`<button class="da primary" id="redoMissed">${missed.length} kelimeyi tekrar et</button>`:''}
        <button class="da sec" id="backBtn">Geri dön</button>
        <button class="da sec" id="homeBtn">Ana sayfa</button>
      </div>
    </div>`;
  if(missed.length) document.getElementById('redoMissed').addEventListener('click', ()=> startFlash(shuffle(missed), ctx));
  document.getElementById('backBtn').addEventListener('click', ctx.back);
  document.getElementById('homeBtn').addEventListener('click', ()=> go({name:'home'}));
}

/* ---------------- QUIZ ---------------- */
function startQuiz(words, ctx){
  keyHandler=null;
  const qs=shuffle(words); const total=qs.length; let i=0, score=0;
  const allMeanings=WORDS.map(w=>w[1]);

  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="qBack">‹ Çık</button>
      <div><div class="st-title">${esc(ctx.label)} · Test</div><div class="st-sub">Doğru Türkçe karşılığı seç</div></div>
      <div class="st-count" id="qCount"></div>
    </div>
    <div class="st-bar"><i id="qBar"></i></div>
    <div id="qBody"></div>`;
  document.getElementById('qBack').addEventListener('click', ctx.back);

  function options(w){ const s=new Set([w.tr]); let g=0; while(s.size<4&&g<300){ s.add(allMeanings[Math.floor(Math.random()*allMeanings.length)]); g++; } return shuffle([...s]); }

  function showQ(){
    const w=qs[i];
    document.getElementById('qCount').textContent=`${i+1} / ${total}`;
    document.getElementById('qBar').style.width=(i/total*100)+'%';
    const opts=options(w); const L=['A','B','C','D'];
    document.getElementById('qBody').innerHTML = `
      <div class="q-prompt"><div class="q-kick">Bu fiilin anlamı?</div><div class="q-word">${esc(w.en)}</div></div>
      <div class="q-opts">${opts.map((o,k)=>`<button class="opt" data-tr="${esc(o)}"><span class="opt-key">${L[k]}</span><span>${esc(o)}</span><span class="opt-mark"></span></button>`).join('')}</div>
      <div class="q-next-wrap" id="qNextWrap"></div>`;
    const els=[...document.querySelectorAll('.opt')];
    els.forEach(el=> el.addEventListener('click', ()=> answer(el, w, els)));
    keyHandler=(e)=>{ const m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()]; if(m!=null&&els[m]&&!els[m].disabled) els[m].click(); };
  }
  function answer(el, w, els){
    const correct = el.dataset.tr===w.tr;
    els.forEach(o=>{ o.disabled=true; if(o.dataset.tr===w.tr){ o.classList.add('correct'); o.querySelector('.opt-mark').textContent='✓'; } });
    if(correct){ score++; rate(w.id,true); } else { el.classList.add('wrong'); el.querySelector('.opt-mark').textContent='✕'; rate(w.id,false); }
    const last=(i===total-1);
    document.getElementById('qNextWrap').innerHTML=`<button class="q-next" id="qNext">${last?'Sonuçları gör':'Sonraki soru ›'}</button>`;
    const nx=document.getElementById('qNext'); nx.focus();
    const adv=()=>{ i++; if(i>=total) finish(); else showQ(); };
    nx.addEventListener('click', adv);
    keyHandler=(e)=>{ if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); adv(); } };
  }
  function finish(){
    keyHandler=null; document.getElementById('qBar').style.width='100%';
    const pct=Math.round(score/total*100);
    let badge,title;
    if(pct>=90){badge='good';title='Mükemmel! 🌟';}
    else if(pct>=70){badge='good';title='Çok iyi 👏';}
    else if(pct>=50){badge='mid';title='Fena değil';}
    else {badge='mid';title='Biraz daha tekrar gerek';}
    app.innerHTML = `
      <div class="done">
        <div class="d-badge ${badge}">${pct>=70?'✓':'↻'}</div>
        <div class="d-title">${title}</div>
        <div class="d-score">${score}<small> / ${total}</small></div>
        <div class="done-chips">
          <span class="chip ok"><b>${score}</b>doğru</span>
          <span class="chip no"><b>${total-score}</b>yanlış</span>
          <span class="chip"><b>%${pct}</b>başarı</span>
        </div>
        <div class="d-sub">Yanlışların erken tekrara döner, doğruların seviye atlar.</div>
        <div class="done-actions">
          <button class="da primary" id="qRetry">Testi tekrar çöz</button>
          <button class="da sec" id="qBackBtn">Geri dön</button>
          <button class="da sec" id="qHome">Ana sayfa</button>
        </div>
      </div>`;
    document.getElementById('qRetry').addEventListener('click', ()=> startQuiz(words, ctx));
    document.getElementById('qBackBtn').addEventListener('click', ctx.back);
    document.getElementById('qHome').addEventListener('click', ()=> go({name:'home'}));
  }
  showQ();
}

/* ---------------- TYPING ---------------- */
function startTyping(words, ctx){
  keyHandler=null;
  const qs=shuffle(words); const total=qs.length; let i=0, correct=0; const missed=[];

  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="tBack">‹ Çık</button>
      <div><div class="st-title">${esc(ctx.label)} · Yaz</div><div class="st-sub">Anlamı gör, İngilizcesini yaz</div></div>
      <div class="st-count" id="tCount"></div>
    </div>
    <div class="st-bar"><i id="tBar"></i></div>
    <div id="tBody"></div>`;
  document.getElementById('tBack').addEventListener('click', ctx.back);

  function norm(s){ return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/^to\s+/,'').replace(/[.,;!?]+$/,''); }

  function showQ(){
    const w=qs[i];
    document.getElementById('tCount').textContent=`${i+1} / ${total}`;
    document.getElementById('tBar').style.width=(i/total*100)+'%';
    document.getElementById('tBody').innerHTML = `
      <div class="type-prompt"><div class="type-kick">Bu anlamın İngilizce fiili?</div><div class="type-tr">${esc(w.tr)}</div></div>
      <div class="type-in-wrap"><input class="type-in" id="tIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="İngilizce yaz…"></div>
      <div class="type-fb" id="tFb"></div>
      <div class="type-actions" id="tActions">
        <button class="type-btn skip" id="tSkip">Bilmiyorum</button>
        <button class="type-btn submit" id="tSubmit">Kontrol et</button>
      </div>`;
    const inp=document.getElementById('tIn');
    setTimeout(()=>inp.focus(),30);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    document.getElementById('tSubmit').addEventListener('click', submit);
    document.getElementById('tSkip').addEventListener('click', ()=> finishQ(false, true));
  }
  function submit(){ const inp=document.getElementById('tIn'); if(!inp.value.trim()){ inp.focus(); return; } finishQ(norm(inp.value)===norm(qs[i].en), false); }
  function finishQ(ok, skipped){
    const w=qs[i]; const inp=document.getElementById('tIn');
    inp.disabled=true; inp.classList.add(ok?'ok':'no');
    rate(w.id, ok);
    if(ok) correct++; else missed.push(w);
    document.getElementById('tFb').innerHTML = ok ? `<span class="fb-ok">✓ Doğru</span>` : `<span class="fb-no">✕ ${skipped?'Atlandı':'Yanlış'}</span> · Doğrusu: <span class="ans">${esc(w.en)}</span>`;
    const last=(i===total-1);
    document.getElementById('tActions').innerHTML = `<button class="type-next" id="tNext">${last?'Sonuçları gör':'Sonraki ›'}</button>`;
    const nx=document.getElementById('tNext'); nx.focus();
    nx.addEventListener('click', ()=>{ i++; if(i>=total) finish(); else showQ(); });
  }
  function finish(){
    document.getElementById('tBar').style.width='100%';
    const pct=Math.round(correct/total*100);
    let badge,title;
    if(pct>=90){badge='good';title='Harika yazım! ✍️';}
    else if(pct>=70){badge='good';title='Çok iyi';}
    else if(pct>=50){badge='mid';title='Fena değil';}
    else {badge='mid';title='Biraz daha pratik';}
    app.innerHTML = `
      <div class="done">
        <div class="d-badge ${badge}">${pct>=70?'✓':'↻'}</div>
        <div class="d-title">${title}</div>
        <div class="d-score">${correct}<small> / ${total}</small></div>
        <div class="done-chips">
          <span class="chip ok"><b>${correct}</b>doğru</span>
          <span class="chip no"><b>${total-correct}</b>yanlış</span>
          <span class="chip"><b>%${pct}</b>başarı</span>
        </div>
        <div class="d-sub">Yazarak çalışmak en zorudur — takıldıkların erken tekrara döner.</div>
        <div class="done-actions">
          ${missed.length?`<button class="da primary" id="tRedo">${missed.length} kelimeyi tekrar yaz</button>`:''}
          <button class="da sec" id="tBackBtn">Geri dön</button>
          <button class="da sec" id="tHome">Ana sayfa</button>
        </div>
      </div>`;
    if(missed.length) document.getElementById('tRedo').addEventListener('click', ()=> startTyping(shuffle(missed), ctx));
    document.getElementById('tBackBtn').addEventListener('click', ctx.back);
    document.getElementById('tHome').addEventListener('click', ()=> go({name:'home'}));
  }
  showQ();
}

/* ---------------- FAMILY BROWSER ---------------- */
function renderFamilyBrowser(u){
  keyHandler=null;
  const w=unitWords(u);
  const items=w.map(x=>{
    const forms=famOf(x.id);
    const badge = forms.length? `${forms.length} türev` : '—';
    const body = forms.length? `<div class="fb-body-inner">${forms.map(f=>`<div class="fam-item"><span class="fw">${esc(f[0])}</span><span class="fm">${esc(f[1])}</span><span class="ft">${esc(tShort(f[2]))}</span></div>`).join('')}</div>` : '';
    return `<div class="fb-item" data-id="${x.id}">
      <button class="fb-head"><span class="fb-en">${esc(x.en)}</span><span class="fb-tr">${esc(x.tr)}</span><span class="fb-badge">${badge}</span>${forms.length?'<span class="fb-chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>':''}</button>
      <div class="fb-body">${body}</div>
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="st-head">
      <button class="back" id="fbBack">‹ Geri</button>
      <div><div class="st-title">Kelime Aileleri · Ünite ${u+1}</div><div class="st-sub">Fiile dokun, türevlerini gör</div></div>
    </div>
    <div>${items}</div>`;
  document.getElementById('fbBack').addEventListener('click', ()=> go({name:'unit',unit:u}));
  app.querySelectorAll('.fb-item').forEach(it=>{
    if(!famOf(+it.dataset.id).length) return;
    it.querySelector('.fb-head').addEventListener('click', ()=> it.classList.toggle('open'));
  });
}

/* ---------------- INIT ---------------- */
(async function(){ await load(); renderHome(); })();
